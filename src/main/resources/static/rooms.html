<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Ideal PG - PG Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }

        /* Navigation Header */
        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-size: 22px; font-weight: 800; color: #38bdf8; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .owner-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .owner-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
        }
        .hero h1 { font-size: 38px; font-weight: 800; margin-bottom: 12px; color: #ffffff; }
        .hero p { color: #94a3b8; font-size: 16px; max-width: 600px; margin: 0 auto; }

        /* Search Section */
        .search-container {
            max-width: 1000px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .search-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
        }
        .search-input-group { flex: 2; min-width: 240px; position: relative; }
        .search-box input, .search-box select {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
        }
        .search-box input:focus, .search-box select:focus { border-color: #38bdf8; }
        
        /* Grid Layout */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        /* Room Cards */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.2);
        }
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: #0f172a;
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .card-body { padding: 22px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
        .card-location { font-size: 14px; color: #94a3b8; display: flex; align-items: center; gap: 4px; margin-bottom: 16px; }
        
        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #334155;
        }
        .card-price { font-size: 22px; font-weight: 800; color: #10b981; }
        .card-price span { font-size: 13px; color: #64748b; font-weight: 400; }
        
        .action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #0284c7; color: #ffffff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand">🏢 PG Hub Marketplace</a>
        <a href="/login.html" class="owner-btn">Owner Portal</a>
    </nav>

    <div class="hero">
        <h1>Find Your Next Home Away From Home</h1>
        <p>Explore verified PG accommodations with real-time availability and transparent pricing.</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="🔍 Search city, area, or PG name..." onkeyup="filterRooms()">
            </div>
            <div style="flex: 1; min-width: 180px;">
                <select id="priceFilter" onchange="filterRooms()">
                    <option value="all">Any Budget</option>
                    <option value="50
