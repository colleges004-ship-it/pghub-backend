<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Hub - Terminal Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0d0e12; 
            color: #e2e8f0; 
            min-height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-panel {
            background: #151821;
            border: 1px solid #222738;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 20px; color: #f8fafc; font-weight: 700; margin-bottom: 5px; }
        p { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: #1e2230;
            border: 1px solid #2e354f;
            border-radius: 6px;
            font-size: 14px;
            color: #f8fafc;
            transition: all 0.2s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover { background-color: #4f46e5; }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        .signup-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-panel">
        <header>
            <h1>Owner Console</h1>
            <p>Authentication Required</p>
        </header>

        <div class="error-message" id="errorBox">
            ❌ Invalid username or password.
        </div>

        <form action="/perform_login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an owner account? <a href="/signup.html">Register here</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'true') {
            document.getElementById('errorBox').style.display = 'block';
        }
    </script>
</body>
</html>
