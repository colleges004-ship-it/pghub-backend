<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Operations & Inventory Console — PG Hub</title>
    <!-- Modern Human Typography: Plus Jakarta Sans & DM Sans (Identical to Dashboard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Warm, minimal white canvas matching dashboard design system */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --bg-hover: #f1f5f9;

            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --border-hover: #cbd5e1;

            --text-main: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            /* Natural Accents */
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #eff6ff;
            --primary-border: #bfdbfe;

            --green: #10b981;
            --green-dark: #059669;
            --green-soft: #ecfdf5;
            --green-border: #a7f3d0;

            --red: #ef4444;
            --red-dark: #dc2626;
            --red-soft: #fef2f2;
            --red-border: #fecaca;

            --amber: #f59e0b;
            --amber-soft: #fffbeb;
            --amber-border: #fde68a;

            /* Soft Layered Shadows & Physical Depth */
            --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 10px 24px -4px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.02);
            --shadow-hover: 0 14px 28px -4px rgba(37, 99, 235, 0.1), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
            --shadow-float: 0 18px 32px -4px rgba(15, 23, 42, 0.12), 0 6px 12px -2px rgba(15, 23, 42, 0.04);

            --radius: 12px;
            --radius-sm: 8px;
            --radius-pill: 9999px;

            --font-head: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
            color: var(--text-body);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 32px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeInPage 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----------------------------------------------------
           1. CONSOLE HEADER & BACK NAVIGATION
           ---------------------------------------------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-emblem {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #ffffff;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
            flex-shrink: 0;
        }

        .title-block h1 {
            font-family: var(--font-head);
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .terminal-badge {
            font-size: 11px;
            background: var(--bg-hover);
            color: var(--text-muted);
            padding: 3px 9px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid var(--border);
            letter-spacing: 0.02em;
        }

        .title-block p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-body);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .back-btn:hover {
            background-color: var(--bg-hover);
            border-color: var(--border-hover);
            color: var(--text-main);
            transform: translateX(-2px);
        }

        /* ----------------------------------------------------
           2. SECTION PANELS WITH TACTILE DEPTH
           ---------------------------------------------------- */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px 32px;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 14px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            font-family: var(--font-head);
            font-size: 16px;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: var(--radius-pill);
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid var(--primary-border);
        }

        /* ----------------------------------------------------
           3. FORM INPUTS & LABELS
           ---------------------------------------------------- */
        .form-row {
            display: flex;
            gap: 14px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.01em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label .hint {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-light);
        }

        input[type="text"], 
        input[type="number"] {
            width: 100%;
            padding: 10px 13px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="text"]:focus, 
        input[type="number"]:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Styled File Input Container */
        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-subtle);
            border: 1px dashed var(--border-hover);
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .file-upload-box:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        input[type="file"] {
            font-size: 12px;
            color: var(--text-muted);
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            width: 100%;
        }

        input[type="file"]::file-selector-button {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 12px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: all 0.15s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--bg-hover);
            border-color: var(--border-hover);
        }

        /* ----------------------------------------------------
           4. AMENITIES / SERVICES CHECKBOX GRID
           ---------------------------------------------------- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 4px;
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-body);
            background: var(--bg-subtle);
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
            user-select: none;
        }

        .checkbox-container:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            color: var(--text-main);
        }

        .checkbox-container input {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: var(--primary);
        }

        /* Highlight checked items */
        .checkbox-container:has(input:checked) {
            background: var(--primary-soft);
            border-color: var(--primary-border);
            color: var(--primary);
            font-weight: 600;
        }

        /* ----------------------------------------------------
           5. BUTTONS & ACTIONS WITH TACTILE ELEVATION
           ---------------------------------------------------- */
        button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: 1px solid #1e40af;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-success {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: 1px solid #047857;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-danger {
            background: #ffffff;
            color: var(--red-dark);
            border: 1px solid var(--red-border);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .btn-danger:hover {
            background: var(--red-soft);
            border-color: var(--red);
            transform: translateY(-1px);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .divider {
            border: 0;
            border-top: 1px dashed var(--border);
            margin: 22px 0;
        }

        /* ----------------------------------------------------
           TOAST NOTIFICATION STACK
           ---------------------------------------------------- */
        #toastStack {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: none;
        }

        .toast-pill {
            min-width: 280px;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInToast 0.25s ease;
            pointer-events: auto;
        }

        .toast-pill.success { border-left: 4px solid var(--green); }
        .toast-pill.error { border-left: 4px solid var(--red); }
        .toast-pill.info { border-left: 4px solid var(--primary); }

        @keyframes slideInToast {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .btn-group { flex-direction: column; }
            .panel { padding: 22px 18px; }
            header { flex-direction: column; align-items: flex-start; }
            .back-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="toastStack"></div>

    <div class="container">
        
        <!-- HEADER -->
        <header>
            <div class="brand-header-left">
                <div class="brand-emblem" aria-hidden="true">🏢</div>
                <div class="title-block">
                    <h1>
                        Asset Operations Console
                        <span class="terminal-badge">Owner Terminal</span>
                    </h1>
                    <p>Register new room assets and modify inventory records</p>
                </div>
            </div>
            <!-- Points to dashboard.html -->
            <a href="/dashboard.html" class="back-btn">
                <span>←</span> Back to Ledger
            </a>
        </header>

        <!-- PANEL 1: REGISTER NEW ROOM ASSET -->
        <section class="panel">
            <div class="panel-header">
                <h2><span>＋</span> Register New PG Asset</h2>
                <span class="panel-badge">Create Record</span>
            </div>

            <form id="addRoomForm" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <span>Room Number</span>
                            <span class="hint">e.g. 102</span>
                        </label>
                        <input type="text" name="roomNumber" placeholder="e.g. 102" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <span>Max Capacity</span>
                            <span class="hint">Persons</span>
                        </label>
                        <input type="number" name="capacity" value="2" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <span>Room Title / Type</span>
                        <span class="hint">Marketing headline</span>
                    </label>
                    <input type="text" name="title" value="Premium Double Sharing Room" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <span>Building / Wing Location</span>
                        </label>
                        <input type="text" name="location" value="Salt Lake, Block JC" required>
                    </div>

                    <div class="form-group">
                        <label for="pricePerDay">Tariff Per Day (₹)</label>
                        <input type="number" id="pricePerDay" name="pricePerDay" placeholder="e.g. 1000" min="1" step="any" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <span>Asset Preview Image</span>
                        <span class="hint">JPG, PNG, WebP</span>
                    </label>
                    <div class="file-upload-box">
                        <input type="file" name="image" accept="image/*" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Included Services & Amenities</label>
                    <div class="services-grid">
                        <label class="checkbox-container"><input type="checkbox" name="facilities" value="WiFi" checked> Wi-Fi</label>
                        <label class="checkbox-container"><input type="checkbox" name="facilities" value="AC" checked> AC</label>
                        <label class="checkbox-container"><input type="checkbox" name="facilities" value="Geyser" checked> Geyser</label>
                        <label class="checkbox-container"><input type="checkbox" name="facilities" value="Laundry"> Laundry</label>
                        <label class="checkbox-container"><input type="checkbox" name="facilities" value="None"> No Facilities</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="uploadSubmitBtn" style="margin-top: 8px;">
                    <span>Upload Asset Details</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>
        </section>

        <!-- PANEL 2: MANAGE EXISTING INVENTORY -->
        <section class="panel">
            <div class="panel-header">
                <h2><span>⚙️</span> Manage Existing Records</h2>
                <span class="panel-badge" style="background: var(--amber-soft); color: #b45309; border-color: var(--amber-border);">Update / Purge</span>
            </div>

            <div class="form-group">
                <label>
                    <span>Target Asset Database ID</span>
                    <span class="hint">Lookup by #ID</span>
                </label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="roomId" placeholder="e.g. 101" style="flex: 1;">
                    <button type="button" class="back-btn" onclick="lookupRoomDetails()" style="width: auto; padding: 0 14px; white-space: nowrap;">
                        <span>🔍</span> Prefill
                    </button>
                </div>
            </div>

            <hr class="divider">

            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;">
                Mutation Payload Values
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>New Room Number</label>
                    <input type="text" id="updateRoomNumber" placeholder="e.g. 104">
                </div>

                <div class="form-group">
                    <label>New Tariff Per Day (₹)</label>
                    <input type="number" id="updatePrice" value="1000">
                </div>
            </div>

            <div class="form-group">
                <label>New Title</label>
                <input type="text" id="updateTitle" value="Updated Room Title">
            </div>

            <div class="form-group">
                <label>New Location</label>
                <input type="text" id="updateLocation" value="Updated Location">
            </div>

            <div class="form-group">
                <label>Update Services</label>
                <div class="services-grid">
                    <label class="checkbox-container"><input type="checkbox" class="update-facility" value="WiFi" checked> Wi-Fi</label>
                    <label class="checkbox-container"><input type="checkbox" class="update-facility" value="AC" checked> AC</label>
                    <label class="checkbox-container"><input type="checkbox" class="update-facility" value="Geyser"> Geyser</label>
                    <label class="checkbox-container"><input type="checkbox" class="update-facility" value="Laundry"> Laundry</label>
                    <label class="checkbox-container"><input type="checkbox" class="update-facility" value="None"> No Facilities</label>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" onclick="handleDelete()" class="btn-danger">
                    <span>🗑️</span> Purge Record
                </button>
                <button type="button" onclick="handleUpdate()" class="btn-success">
                    <span>✓</span> Push Update Changes
                </button>
            </div>
        </section>
    </div>

    <!-- SCRIPT CONTROLLER -->
    <script>
        function showNotification(msg, type = 'info') {
            const host = document.getElementById('toastStack');
            const toast = document.createElement('div');
            toast.className = `toast-pill ${type}`;
            const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
            toast.innerHTML = `<span style="font-weight:700;">${icon}</span><span>${msg}</span>`;
            host.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 250);
            }, 3200);
        }

        // 1. ADD ROOM FORM HANDLER
        document.getElementById('addRoomForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('uploadSubmitBtn');
            submitBtn.style.opacity = '0.8';
            submitBtn.innerHTML = '<span>Uploading asset...</span>';

            const formData = new FormData(this);

            fetch('/api/rooms/add', {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                if (!response.ok) {
                    const errorMessage = await response.text();
                    throw new Error(errorMessage);
                }
                return response.json();
            })
            .then(data => {
                showNotification("Room Added Successfully! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = '/dashboard.html'; 
                }, 1000);
            })
            .catch(err => {
                submitBtn.style.opacity = '1';
                submitBtn.innerHTML = '<span>Upload Asset Details</span><span>→</span>';
                showNotification(err.message, "error");
            });
        });

        // 2. PREFILL ROOM DATA HELPER
        function lookupRoomDetails() {
            const id = document.getElementById('roomId').value;
            if (!id) return showNotification("Please enter a Room ID to prefill", "error");

            fetch('/api/rooms/all')
                .then(res => res.json())
                .then(rooms => {
                    const room = rooms.find(r => String(r.id) === String(id));
                    if (!room) return showNotification(`Room #${id} not found in inventory`, "error");

                    document.getElementById('updateRoomNumber').value = room.roomNumber || '';
                    document.getElementById('updateTitle').value = room.title || '';
                    document.getElementById('updateLocation').value = room.location || '';
                    document.getElementById('updatePrice').value = room.pricePerDay || '';

                    const facs = (room.facilities || []).map(f => String(f).toLowerCase());
                    document.querySelectorAll('.update-facility').forEach(cb => {
                        cb.checked = facs.includes(cb.value.toLowerCase());
                    });

                    showNotification(`Loaded data for Unit ${room.roomNumber}`, "info");
                })
                .catch(err => {
                    showNotification("Could not fetch room details: " + err.message, "error");
                });
        }

        // 3. DELETE HANDLER (Fixed error handling for Legal Lock)
        function handleDelete() {
            const id = document.getElementById('roomId').value;
            if (!id) return showNotification("Please specify a Room ID", "error");
            
            if (!confirm("Are you sure you want to permanently purge room #" + id + "?")) return;

            fetch('/api/rooms/delete/' + id, { method: 'DELETE' })
                .then(async res => {
                    const msg = await res.text();
                    if (!res.ok) throw new Error(msg);
                    return msg;
                })
                .then(msg => { 
                    showNotification(msg || "Room deleted successfully", "success");
                    setTimeout(() => location.reload(), 1200);
                })
                .catch(err => showNotification(err.message, "error"));
        }

        // 4. UPDATE HANDLER
        function handleUpdate() {
            const id = document.getElementById('roomId').value;
            if (!id) return showNotification("Please specify a Room ID", "error");

            const selectedFacilities = [];
            const checkBoxes = document.querySelectorAll('.update-facility:checked');
            checkBoxes.forEach((cb) => {
                selectedFacilities.push(cb.value);
            });

            if (selectedFacilities.length === 0) {
                showNotification("Please select at least one facility (or 'No Facilities') before updating", "error");
                return; 
            }

            const formData = new FormData();
            formData.append('roomNumber', document.getElementById('updateRoomNumber').value);
            formData.append('title', document.getElementById('updateTitle').value);
            formData.append('location', document.getElementById('updateLocation').value);
            formData.append('pricePerDay', document.getElementById('updatePrice').value);
            
            selectedFacilities.forEach(facility => {
                formData.append('facilities', facility);
            });

            fetch('/api/rooms/update/' + id, {
                method: 'PUT',
                body: formData
            })
            .then(async res => {
                if (!res.ok) {
                    const errorMsg = await res.text();
                    throw new Error(errorMsg);
                }
                return res.json();
            })
            .then(data => { 
                showNotification("Room record updated successfully!", "success"); 
                setTimeout(() => location.reload(), 1200); 
            })
            .catch(err => showNotification("Error updating room: " + err.message, "error"));
        }
    </script>
</body>
</html>
