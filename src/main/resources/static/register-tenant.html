<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Hub - Guest Registry</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0d0e12; 
            color: #e2e8f0; 
            min-height: 100vh; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            border-bottom: 1px solid #222738;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: #f8fafc; font-size: 22px; font-weight: 700; }
        h1 span { 
            font-size: 11px; background: #1e2230; color: #94a3b8; 
            padding: 4px 10px; border-radius: 4px; font-weight: 500; 
            border: 1px solid #2e354f; margin-left: 10px;
        }

        .back-btn {
            background-color: #1e2230; border: 1px solid #2e354f; color: #cbd5e1;
            padding: 8px 14px; border-radius: 6px; text-decoration: none;
            font-size: 12px; font-weight: 600; transition: all 0.2s;
        }
        .back-btn:hover { background-color: #2a3044; color: #fff; }

        .panel {
            background: #151821; border: 1px solid #222738;
            border-radius: 8px; padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            font-size: 16px; color: #10b981; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 20px; font-weight: 700;
            border-bottom: 1px solid #222738; padding-bottom: 10px;
        }

        .form-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }

        label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        input[type="text"], input[type="number"], input[type="date"], input[type="tel"] {
            width: 100%; padding: 11px 14px; background: #1e2230;
            border: 1px solid #2e354f; border-radius: 6px;
            font-size: 14px; color: #f8fafc; transition: all 0.2s;
        }

        input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        input[readonly] { opacity: 0.7; cursor: not-allowed; }

        .btn-primary {
            width: 100%; padding: 12px; background-color: #10b981;
            color: white; border: none; border-radius: 6px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-primary:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Legal Guest Registry<span>Compliance Terminal</span></h1>
            <a href="/dashboard.html" class="back-btn">← Back to Dashboard</a>
        </header>

        <section class="panel">
            <h2>Register New Tenant</h2>
            <form id="tenantForm">
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Assign to Room ID</label>
                    <input type="number" id="roomId" placeholder="e.g., 5" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Full Legal Name</label>
                    <input type="text" id="fullName" placeholder="Name as per Government ID" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phoneNumber" placeholder="+91..." required>
                    </div>
                    <div class="form-group">
                        <label>Gov ID Number</label>
                        <input type="text" id="governmentIdNumber" placeholder="ID Number" required autocomplete="off">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Check-In Date</label>
                        <input type="date" id="checkInDate" required>
                    </div>
                    <div class="form-group">
                        <label>Expected Check-Out</label>
                        <input type="date" id="checkOutDate" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Record Legal Entry</button>
            </form>
        </section>
    </div>

    <script>
        // 1. Auto-fill the Room ID if clicking from the dashboard
        const urlParams = new URLSearchParams(window.location.search);
        const passedRoomId = urlParams.get('roomId');

        if (passedRoomId) {
            const roomInput = document.getElementById('roomId');
            roomInput.value = passedRoomId;
            roomInput.readOnly = true; 
        }

        // 2. Handle form submission
        document.getElementById('tenantForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const roomId = document.getElementById('roomId').value;
            
            // EXACT MATCH: These keys (left side of the colon) match the Java variables perfectly.
            const tenantData = {
                fullName: document.getElementById('fullName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                governmentIdNumber: document.getElementById('governmentIdNumber').value,
                checkInDate: document.getElementById('checkInDate').value,
                checkOutDate: document.getElementById('checkOutDate').value
            };

            fetch('/api/rooms/' + roomId + '/tenants/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(tenantData)
            })
            .then(async response => {
                if (!response.ok) {
                    const errMsg = await response.text();
                    throw new Error(errMsg);
                }
                return response.text();
            })
            .then(msg => {
                alert("✅ " + msg);
                window.location.href = '/dashboard.html';
            })
            .catch(err => alert("Error: " + err.message));
        });
    </script>
</body>
</html>
