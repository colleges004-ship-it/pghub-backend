<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registry & Compliance — Property Operations</title>
    <!-- Modern Human Typography: Plus Jakarta Sans & DM Sans (Identical to Dashboard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Warm, minimal white canvas matching dashboard design system */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --bg-hover: #f1f5f9;

            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --border-hover: #cbd5e1;

            --text-main: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            /* Natural Accents */
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #eff6ff;
            --primary-border: #bfdbfe;

            --green: #10b981;
            --green-dark: #059669;
            --green-soft: #ecfdf5;
            --green-border: #a7f3d0;

            --red: #ef4444;
            --red-dark: #dc2626;
            --red-soft: #fef2f2;
            --red-border: #fecaca;

            --amber: #f59e0b;
            --amber-soft: #fffbeb;
            --amber-border: #fde68a;

            /* Soft Layered Shadows */
            --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 12px 28px -4px rgba(15, 23, 42, 0.07), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
            --shadow-hover: 0 4px 12px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
            --shadow-float: 0 16px 32px -4px rgba(15, 23, 42, 0.1), 0 6px 12px -2px rgba(15, 23, 42, 0.04);

            --radius: 12px;
            --radius-sm: 8px;
            --radius-pill: 9999px;

            --font-head: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
            color: var(--text-body);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 32px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeInPage 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----------------------------------------------------
           1. TOP HEADER & NAVIGATION
           ---------------------------------------------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-emblem {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
            flex-shrink: 0;
        }

        .title-block h1 {
            font-family: var(--font-head);
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .compliance-tag {
            font-size: 11px;
            background: var(--bg-hover);
            color: var(--text-muted);
            padding: 3px 9px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid var(--border);
            letter-spacing: 0.02em;
        }

        .title-block p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-body);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .back-btn:hover {
            background-color: var(--bg-hover);
            border-color: var(--border-hover);
            color: var(--text-main);
            transform: translateX(-2px);
        }

        /* ----------------------------------------------------
           2. MAIN FORM CARD (SUBTLE DEPTH)
           ---------------------------------------------------- */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px 32px;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 14px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            font-family: var(--font-head);
            font-size: 16px;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .capacity-badge {
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid var(--primary-border);
            padding: 4px 11px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* ----------------------------------------------------
           3. FORM INPUTS & LAYOUT
           ---------------------------------------------------- */
        .form-row {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.01em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="date"] {
            width: 100%;
            padding: 10px 13px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input[readonly] {
            background-color: var(--bg-hover);
            color: var(--text-muted);
            border-color: var(--border);
            cursor: not-allowed;
            font-weight: 600;
        }

        /* ----------------------------------------------------
           4. GUEST BLOCK (ELEVATED INNER CARD)
           ---------------------------------------------------- */
        .guest-block {
            background: #ffffff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-sm);
            padding: 20px 20px 14px;
            margin-bottom: 18px;
            position: relative;
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
        }

        .guest-block.primary-guest {
            border-left-color: var(--green);
            background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
        }

        .guest-title {
            font-family: var(--font-head);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .guest-title .role-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
        }

        .role-tag.primary {
            background: var(--green-soft);
            color: var(--green-dark);
            border: 1px solid var(--green-border);
        }

        .role-tag.dependent {
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid var(--primary-border);
        }

        .remove-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #ffffff;
            color: var(--red-dark);
            border: 1px solid var(--red-border);
            padding: 4px 9px;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .remove-btn:hover {
            background: var(--red-soft);
            border-color: var(--red);
        }

        /* ----------------------------------------------------
           FILE UPLOAD INPUT BOX
           ---------------------------------------------------- */
        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg-subtle);
            border: 1px dashed var(--border-hover);
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .file-upload-box:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .file-upload-box input[type="file"] {
            font-size: 12px;
            color: var(--text-muted);
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
        }

        /* ----------------------------------------------------
           5. ACTION BUTTONS
           ---------------------------------------------------- */
        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-soft);
            color: var(--primary);
            border: 1px dashed var(--primary-border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-add:hover:not(:disabled) {
            background-color: #dbeafe;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .btn-primary {
            width: 100%;
            padding: 13px 18px;
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: 1px solid #047857;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ----------------------------------------------------
           TOAST NOTIFICATION STACK
           ---------------------------------------------------- */
        #toastStack {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            pointer-events: none;
        }

        .toast-pill {
            min-width: 280px;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInToast 0.25s ease;
            pointer-events: auto;
        }

        .toast-pill.success { border-left: 4px solid var(--green); }
        .toast-pill.error { border-left: 4px solid var(--red); }
        .toast-pill.info { border-left: 4px solid var(--primary); }

        @keyframes slideInToast {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .panel { padding: 20px 18px; }
            header { flex-direction: column; align-items: flex-start; }
            .back-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="toastStack"></div>

    <div class="container">
        
        <!-- HEADER -->
        <header>
            <div class="brand-header-left">
                <div class="brand-emblem" aria-hidden="true">🏢</div>
                <div class="title-block">
                    <h1>
                        Legal Guest Registry
                        <span class="compliance-tag">Compliance Terminal</span>
                    </h1>
                    <p>Register lawful tenants, lease dates, and government identities</p>
                </div>
            </div>
            <a href="/dashboard.html" class="back-btn">
                <span>←</span> Back to Dashboard
            </a>
        </header>

        <!-- MAIN PANEL -->
        <section class="panel">
            <div class="panel-header">
                <h2><span>👥</span> Register Family / Group</h2>
                <div class="capacity-badge" id="capacityBadge">
                    <span>⏳</span> Loading Capacity...
                </div>
            </div>

            <form id="tenantForm">
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="roomId">
                        <span>Assign to Room ID</span>
                        <span style="font-weight: 500; color: var(--text-muted); font-size: 11px;">Unit identifier</span>
                    </label>
                    <input type="number" id="roomId" placeholder="e.g. 101" required>
                </div>

                <!-- Dynamic container for Guest 1 + dependents -->
                <div id="guestsContainer"></div>

                <button type="button" id="addGuestBtn" class="btn-add" style="display: none;">
                    <span>＋</span> Add Family Member
                </button>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span>✓ Confirm & Register Tenants</span>
                </button>
            </form>
        </section>
    </div>

<script>
        let roomMaxCapacity = 1;
        let currentGuestCount = 0;

        const guestsContainer = document.getElementById('guestsContainer');
        const addGuestBtn = document.getElementById('addGuestBtn');
        const roomInput = document.getElementById('roomId');

        const urlParams = new URLSearchParams(window.location.search);
        const passedRoomId = urlParams.get('roomId');

        function showNotification(msg, type = 'info') {
            const host = document.getElementById('toastStack');
            const toast = document.createElement('div');
            toast.className = `toast-pill ${type}`;
            const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
            toast.innerHTML = `<span style="font-weight:700;">${icon}</span><span>${msg}</span>`;
            host.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 250);
            }, 3200);
        }

        function loadRoomCapacity(targetId, isInitialLoad = false) {
            fetch('/api/rooms/all')
                .then(res => {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.json();
                })
                .then(rooms => {
                    const room = rooms.find(r => String(r.id) === String(targetId));
                    if (room) {
                        roomMaxCapacity = room.capacity || 2;
                        document.getElementById('capacityBadge').innerHTML = `<span>👥</span> Room ${room.roomNumber} (Max ${roomMaxCapacity} Guests)`;
                        addGuestBtn.style.display = 'inline-flex';
                        checkButtonVisibility();
                    } else {
                        document.getElementById('capacityBadge').textContent = "Room Not Found in Ledger";
                        addGuestBtn.style.display = 'none';
                    }
                    if (isInitialLoad) appendGuestBlock();
                })
                .catch(err => {
                    console.warn("Could not query rooms API:", err.message);
                    roomMaxCapacity = 2;
                    document.getElementById('capacityBadge').innerHTML = `<span>👥</span> Max Capacity: ${roomMaxCapacity} Guests`;
                    addGuestBtn.style.display = 'inline-flex';
                    if (isInitialLoad) appendGuestBlock();
                });
        }

        // Initialize from URL parameter or manual entry
        if (passedRoomId) {
            roomInput.value = passedRoomId;
            roomInput.readOnly = true;
            loadRoomCapacity(passedRoomId, true);
        } else {
            document.getElementById('capacityBadge').innerHTML = `<span>📝</span> Manual Room Entry`;
            appendGuestBlock();
            roomInput.addEventListener('change', () => {
                if (roomInput.value) loadRoomCapacity(roomInput.value, false);
            });
        }

        function appendGuestBlock() {
            if (currentGuestCount >= roomMaxCapacity) {
                showNotification(`This room can only accommodate a maximum of ${roomMaxCapacity} guests.`, "error");
                return;
            }

            currentGuestCount++;
            const isPrimary = currentGuestCount === 1;
            const todayObj = new Date();
            const minDateStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;
            
            const block = document.createElement('div');
            block.className = `guest-block ${isPrimary ? 'primary-guest' : ''}`;
            
            block.innerHTML = `
                <div class="guest-title">
                    <span>${isPrimary ? '👑' : '👤'}</span>
                    <span>${isPrimary ? 'Guest 1 (Primary Contact)' : 'Guest ' + currentGuestCount}</span>
                    <span class="role-tag ${isPrimary ? 'primary' : 'dependent'}">
                        ${isPrimary ? 'Leaseholder' : 'Dependent'}
                    </span>
                </div>
                
                ${!isPrimary ? `<button type="button" class="remove-btn" onclick="this.parentElement.remove(); currentGuestCount--; checkButtonVisibility();">✕ Remove</button>` : ''}
                
                <div class="form-group">
                    <label>Full Legal Name</label>
                    <input type="text" class="fullName" placeholder="Full name as printed on Government ID" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <span>Phone Number</span>
                            ${!isPrimary ? '<span style="color:var(--text-muted); font-size:11px; font-weight:normal;">(Optional)</span>' : ''}
                        </label>
                        <input type="tel" class="phoneNumber" placeholder="+91 98765 43210" ${isPrimary ? 'required' : ''}>
                    </div>
                    <div class="form-group">
                        <label>Gov ID Number</label>
                        <input type="text" class="govId" placeholder="Government ID Number" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label>
                        <span>Attach Gov ID Proof (Photo/Document)</span>
                        <span style="font-size:11px; font-weight:normal; color:var(--text-muted);">PNG, JPG, PDF</span>
                    </label>
                    <div class="file-upload-box">
                        <input type="file" class="idImage" accept="image/*">
                    </div>
                </div>

                ${isPrimary ? `
                <div class="form-row" style="margin-bottom: 0;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Check-In Date</label>
                        <input type="date" class="checkIn" min="${minDateStr}" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Expected Check-Out</label>
                        <input type="date" class="checkOut" min="${minDateStr}" required>
                    </div>
                </div>` : ''} 
            `;
            
            guestsContainer.appendChild(block);
            checkButtonVisibility();
        }

        function checkButtonVisibility() {
            if (currentGuestCount >= roomMaxCapacity) {
                addGuestBtn.style.opacity = '0.5';
                addGuestBtn.style.cursor = 'not-allowed';
                addGuestBtn.innerHTML = '<span>🔒 Room at Maximum Capacity</span>';
            } else {
                addGuestBtn.style.opacity = '1';
                addGuestBtn.style.cursor = 'pointer';
                addGuestBtn.innerHTML = '<span>＋ Add Family Member</span>';
            }
        }

        addGuestBtn.addEventListener('click', () => {
            if (currentGuestCount < roomMaxCapacity) {
                appendGuestBlock();
            }
        });

        document.getElementById('tenantForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const roomId = document.getElementById('roomId').value;
            
            const familyMembers = [];
            const blocks = document.querySelectorAll('.guest-block');
            
            if (blocks.length === 0) {
                showNotification("Please provide at least one guest record", "error");
                return;
            }

            const primaryCheckInInput = blocks[0].querySelector('.checkIn');
            const primaryCheckOutInput = blocks[0].querySelector('.checkOut');

            const primaryCheckIn = primaryCheckInInput ? primaryCheckInInput.value : '';
            const primaryCheckOut = primaryCheckOutInput ? primaryCheckOutInput.value : '';

            // Fixed: Check-out must be strictly after check-in (<=)
            if (primaryCheckIn && primaryCheckOut && primaryCheckOut <= primaryCheckIn) {
                showNotification("Check-out date must be at least one day after check-in date", "error");
                return;
            }
            
            const formData = new FormData();

            blocks.forEach(block => {
                familyMembers.push({
                    fullName: block.querySelector('.fullName').value,
                    phoneNumber: block.querySelector('.phoneNumber').value || "", 
                    governmentIdNumber: block.querySelector('.govId').value,
                    checkInDate: primaryCheckIn,
                    checkOutDate: primaryCheckOut
                });

                const fileInput = block.querySelector('.idImage');
                if (fileInput && fileInput.files.length > 0) {
                    formData.append('idFiles', fileInput.files[0]);
                } else {
                    formData.append('idFiles', new Blob([], { type: 'application/octet-stream' }), "");
                }
            });

            formData.append('familyData', JSON.stringify(familyMembers));

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.style.opacity = '0.8';
            submitBtn.innerHTML = '<span>⏳ Submitting Registration...</span>';

            fetch('/api/rooms/' + roomId + '/tenants/add', {
                method: 'POST',
                body: formData 
            })
            .then(async response => {
                if (!response.ok) {
                    const errMsg = await response.text();
                    throw new Error(errMsg);
                }
                return response.text();
            })
            .then(msg => {
                showNotification("Tenants registered successfully!", "success");
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
            })
            .catch(err => {
                submitBtn.style.opacity = '1';
                submitBtn.innerHTML = '<span>✓ Confirm & Register Tenants</span>';
                showNotification("Error: " + err.message, "error");
            });
        });
    </script>
</body>
</html>
