<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Portal - Dark Ledger & Maintenance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0e12; color: #e2e8f0; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* Fixed Left Panel - Dark Mode Accent */
        .sidebar { width: 310px; background: #151821; border-right: 1px solid #222738; padding: 30px 20px; position: fixed; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; gap: 24px; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3); }
        .sidebar-title { font-size: 18px; color: #f8fafc; font-weight: 700; border-bottom: 1px solid #222738; padding-bottom: 12px; letter-spacing: 0.5px; }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-label { font-size: 11px; font-weight: 700; color: #6366f1; text-transform: uppercase; letter-spacing: 1px; }
        
        .search-input { width: 100%; padding: 11px 14px; background: #1e2230; border: 1px solid #2e354f; border-radius: 6px; font-size: 14px; color: #f8fafc; transition: all 0.2s; }
        .search-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        
        .status-select { width: 100%; padding: 11px 14px; background: #1e2230; border: 1px solid #2e354f; border-radius: 6px; font-size: 14px; color: #cbd5e1; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        
        .amenities-list { display: flex; flex-direction: column; gap: 10px; }
        .filter-option { display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; font-weight: 600; color: #94a3b8; background: #1e2230; padding: 10px 14px; border: 1px solid #2e354f; border-radius: 6px; }
        .filter-option input { cursor: pointer; width: 15px; height: 15px; accent-color: #6366f1; }

        .nav-btn { background-color: #6366f1; color: white; padding: 12px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; text-align: center; margin-top: auto; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* Main Workspace Area */
        .main-content { margin-left: 310px; flex-grow: 1; padding: 40px; background-color: #0d0e12; transition: margin-right 0.3s ease; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #222738; padding-bottom: 20px; }
        
        h1 { color: #f8fafc; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        h1 span { font-size: 12px; background: #1e2230; color: #94a3b8; padding: 4px 10px; border-radius: 4px; font-weight: 500; border: 1px solid #2e354f; }

        /* Table Design */
        .ledger-wrapper { background: #151821; border: 1px solid #222738; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead { background-color: #1e2230; border-bottom: 2px solid #222738; }
        th { padding: 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #6366f1; letter-spacing: 0.5px; }
        td { padding: 16px; border-bottom: 1px solid #222738; vertical-align: middle; font-size: 14px; color: #cbd5e1; }

        .thumbnail { width: 75px; height: 52px; object-fit: cover; border-radius: 6px; background-color: #1e2230; border: 1px solid #2e354f; }
        .room-id-badge { font-weight: bold; color: #6366f1; background: rgba(99, 102, 241, 0.15); padding: 4px 8px; border-radius: 4px; font-size: 12px; border: 1px solid rgba(99, 102, 241, 0.3); }

        .room-no-container { display: flex; align-items: center; gap: 8px; }

        /* Pulsing Red Dot Badge with Complaint Count */
        .btn-badge { 
            position: absolute; 
            top: -6px; 
            right: -6px; 
            min-width: 16px;
            height: 16px;
            background-color: #ef4444; 
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
            border-radius: 50%; 
            display: flex; 
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px #ef4444; 
            animation: pulse 1.5s infinite; 
            border: 1.5px solid #151821;
            padding: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .facilities-container { display: flex; flex-wrap: wrap; gap: 6px; max-width: 220px; }
        .facility-tag { background: #1e2230; color: #cbd5e1; padding: 3px 8px; border-radius: 4px; font-size: 11px; border: 1px solid #2e354f; }

        .status-container { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-active { color: #34d399; }
        .status-active .status-dot { background-color: #34d399; box-shadow: 0 0 8px #34d399; }
        .status-vacant { color: #f87171; }
        .status-vacant .status-dot { background-color: #f87171; box-shadow: 0 0 8px #f87171; }

        .btn-group { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;}
        .toggle-btn { background-color: #1e2230; border: 1px solid #2e354f; color: #cbd5e1; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: background 0.2s; }
        .toggle-btn:hover { background-color: #2a3044; }
        
        .manage-btn { 
            background-color: rgba(99, 102, 241, 0.1); 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            color: #818cf8; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 600; 
            position: relative; 
            transition: background 0.2s;
        }
        .manage-btn:hover { background-color: rgba(99, 102, 241, 0.2); }

        /* SIDE PANEL / DRAWER COMPONENTS */
        .drawer { position: fixed; right: -350px; top: 0; width: 350px; height: 100vh; background: #151821; border-left: 1px solid #222738; box-shadow: -5px 0 25px rgba(0,0,0,0.5); transition: right 0.3s ease; z-index: 100; padding: 30px 24px; display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222738; padding-bottom: 15px; margin-bottom: 20px; }
        .drawer-title { font-size: 18px; font-weight: 700; color: #f8fafc; }
        .close-drawer { background: none; border: none; color: #64748b; font-size: 24px; cursor: pointer; }
        .close-drawer:hover { color: #f8fafc; }

        .list-wrapper { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Shared list item styles */
        .list-item { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #1e2230; border-radius: 6px; border: 1px solid #2e354f; border-left-width: 4px; }
        .complaint-item { border-left-color: #ef4444; }
        .complaint-item.resolved { border-left-color: #10b981; opacity: 0.65; }
        
        /* Guest item styling */
        .guest-item { border-left-color: #3b82f6; }
        .guest-name { font-weight: bold; color: #f8fafc; font-size: 15px; }
        .guest-detail { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 5px;}

        .complaint-text { font-size: 13px; color: #f8fafc; word-break: break-word; }
        .comp-btn { align-self: flex-end; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .comp-btn.resolve { background: #10b981; color: #fff; }
        .comp-btn.reopen { background: #f59e0b; color: #fff; }

        .add-box { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #222738; padding-top: 20px; }
        .add-box input { width: 100%; padding: 11px 14px; background: #1e2230; border: 1px solid #2e354f; color: #fff; border-radius: 6px; font-size: 14px; }
        .add-box button { background: #6366f1; color: white; border: none; padding: 11px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .add-box button:hover { background-color: #4f46e5; }

        .no-data { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-title">Filters</div>
        <div class="control-group">
            <span class="control-label">Search Room No.</span>
            <input type="text" id="roomSearchInput" class="search-input" placeholder="🔍 e.g. 102..." onkeyup="applyFilters()">
        </div>
        <div class="control-group">
            <span class="control-label">Availability Status</span>
            <select id="roomStatusFilter" class="status-select" onchange="applyFilters()">
                <option value="all">All Statuses</option>
                <option value="available">🟢 Vacant / Available</option>
                <option value="occupied">🔴 Occupied</option>
            </select>
        </div>
        <div class="control-group">
            <span class="control-label">Filter Amenities</span>
            <div class="amenities-list">
                <label class="filter-option"><input type="checkbox" class="facility-filter" value="WiFi" onchange="applyFilters()"> Wi-Fi</label>
                <label class="filter-option"><input type="checkbox" class="facility-filter" value="AC" onchange="applyFilters()"> AC</label>
                <label class="filter-option"><input type="checkbox" class="facility-filter" value="Geyser" onchange="applyFilters()"> Geyser</label>
                <label class="filter-option"><input type="checkbox" class="facility-filter" value="Laundry" onchange="applyFilters()"> Laundry</label>
            </div>
        </div>
        <a href="/upload-test.html" class="nav-btn">+ Add New Inventory</a>
    </aside>

    <main class="main-content" id="mainContent">
        
        <header>
            <h1>Property Registry <span>Owner Operations Terminal</span></h1>
            <form action="/perform_logout" method="POST">
                <button type="submit" class="manage-btn" style="background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #f87171; padding: 10px 16px; font-size: 14px;">
                    🚪 Log Out
                </button>
            </form>
        </header>

        <div class="ledger-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th style="width: 130px;">Room No.</th>
                        <th style="width: 90px;">Preview</th>
                        <th>Room Description</th>
                        <th>Monthly Rent</th>
                        <th>Amenities</th>
                        <th>Availability</th>
                        <th style="text-align: right; width: 330px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody">
                    <tr>
                        <td colspan="8" class="no-data">Loading asset registration index...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- DRAWER 1: COMPLAINTS -->
    <div id="complaintDrawer" class="drawer">
        <div class="drawer-header">
            <div class="drawer-title" id="drawerRoomTitle">Room Log</div>
            <button class="close-drawer" onclick="closeDrawer('complaintDrawer')">&times;</button>
        </div>
        <div class="list-wrapper" id="drawerComplaintsList">
            <!-- Populated via JS -->
        </div>
        <div class="add-box">
            <span class="control-label">File New Complaint</span>
            <input type="text" id="newComplaintInput" placeholder="Write down utility error...">
            <button onclick="submitNewComplaint()">Log Incident</button>
        </div>
    </div>

    <!-- DRAWER 2: GUEST REGISTRY (NEW) -->
    <div id="tenantDrawer" class="drawer">
        <div class="drawer-header">
            <div class="drawer-title" id="drawerTenantTitle">Guest Registry</div>
            <button class="close-drawer" onclick="closeDrawer('tenantDrawer')">&times;</button>
        </div>
        <div class="list-wrapper" id="drawerTenantList">
            <!-- Populated via JS -->
        </div>
        <div class="add-box" style="border-top: none; padding-top: 0;">
            <button onclick="redirectToAddTenant()" style="background-color: #10b981;">+ Register New Legal Guest</button>
        </div>
    </div>

    <script>
        let allRoomsMemory = []; 
        let activeDrawerRoomId = null;

        document.addEventListener("DOMContentLoaded", fetchLedger);

        function fetchLedger() {
            fetch('/api/rooms/all')
                .then(res => { if (!res.ok) throw new Error("Backend connection lost"); return res.json(); })
                .then(rooms => {
                    allRoomsMemory = rooms;
                    renderTableData(allRoomsMemory);
                    
                    // Keep drawers updated if they are open
                    if (document.getElementById('complaintDrawer').classList.contains('open')) {
                        openComplaintDrawer(activeDrawerRoomId);
                    }
                    if (document.getElementById('tenantDrawer').classList.contains('open')) {
                        openTenantDrawer(activeDrawerRoomId);
                    }
                })
                .catch(err => {
                    document.getElementById('ledgerBody').innerHTML = `<tr><td colspan="8" class="no-data" style="color:#f87171;">Error pulling data ledger stream: ${err.message}</td></tr>`;
                });
        }

        function uploadIdPhotoLater(tenantId, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            // Change cursor to show it's working
            document.body.style.cursor = 'wait';

            fetch(`/api/rooms/tenants/${tenantId}/upload-id`, {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                if (!response.ok) {
                    const errMsg = await response.text();
                    throw new Error(errMsg);
                }
                return response.text();
            })
            .then(msg => {
                alert("✅ " + msg);
                // Refresh the memory and drawer to instantly show the new "View ID" button
                fetchRooms(); 
            })
            .catch(err => alert("Error: " + err.message))
            .finally(() => {
                document.body.style.cursor = 'default';
            });
        }

function renderTableData(roomsToRender) {
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';

            if (roomsToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="no-data">No rooms match criteria.</td></tr>`;
                return;
            }

            // Get current month info for the timeline
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); 
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthName = today.toLocaleString('default', { month: 'short' });

            roomsToRender.forEach(room => {
                let facilitiesHTML = (room.facilities || [])
                    .filter(f => f.toLowerCase() !== 'none')
                    .map(f => `<span class="facility-tag">${f}</span>`).join('');
                if (!facilitiesHTML) facilitiesHTML = '<span style="color:#64748b; font-style:italic; font-size:11px;">None</span>';

                const activeComplaintsCount = room.complaints ? room.complaints.filter(c => !c.resolved).length : 0;
                const actionBadgeHTML = activeComplaintsCount > 0 
                    ? `<span class="btn-badge" title="${activeComplaintsCount} Active Issues">${activeComplaintsCount}</span>` 
                    : '';

                const tenantCount = room.tenants ? room.tenants.length : 0;
                const maxCap = room.capacity ? room.capacity : 2; 

// 👇 1. GENERATE 3 DISTINCT MONTHLY BARS 👇
                let monthsHTML = '';
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                
                // Loop 3 times: Current Month, Next Month, and Month After Next
                for (let mOffset = 0; mOffset < 3; mOffset++) {
                    const targetMonth = new Date(today.getFullYear(), today.getMonth() + mOffset, 1);
                    const year = targetMonth.getFullYear();
                    const month = targetMonth.getMonth();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    
                    const monthName = targetMonth.toLocaleString('default', { month: 'short' }).toUpperCase();
                    let timelineBlocks = '';

                    for (let day = 1; day <= daysInMonth; day++) {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        
                        let isBooked = false;
                        if (room.tenants && room.tenants.length > 0) {
                            for (let t of room.tenants) {
                                if (dateStr >= t.checkInDate && dateStr < t.checkOutDate) {
                                    isBooked = true;
                                    break;
                                }
                            }
                        }

                        const isToday = (dateStr === todayStr);
                        const isPast = (dateStr < todayStr);
                        
                        let blockColor = '';
                        if (isToday) {
                            blockColor = '#ffffff'; 
                        } else if (isPast) {
                            blockColor = isBooked ? '#8c4a4a' : '#475569'; 
                        } else {
                            blockColor = isBooked ? '#ef4444' : '#22c55e'; 
                        }
                        
                        let segmentStyle = `flex: 1; background-color: ${blockColor}; height: 100%;`;
                        let tooltipText = `${dateStr}: ${isBooked ? 'Occupied' : 'Available'}`;

                        if (isToday) {
                            segmentStyle = `flex: 1.5; background-color: #ffffff; height: 12px; margin-top: -4px; z-index: 10; position: relative; border-radius: 1px; box-shadow: 0 0 4px rgba(255,255,255,0.8);`;
                            tooltipText = `📍 TODAY (${dateStr}): ${isBooked ? 'Occupied' : 'Available'}`;
                        } else if (isPast) {
                            tooltipText = `🕰️ PAST (${dateStr}): ${isBooked ? 'Was Occupied' : 'Was Available'}`;
                        }
                        
                        timelineBlocks += `<div style="${segmentStyle}" title="${tooltipText}"></div>`;
                    }
                    
                    // Creates a single row containing the Month Name and its specific Timeline Bar
                    monthsHTML += `
                        <div style="display: flex; align-items: center; margin-bottom: 6px;">
                            <span style="width: 32px; font-size: 9px; font-weight: 600; color: #64748b; letter-spacing: 0.5px;">${monthName}</span>
                            <div style="display: flex; align-items: center; flex: 1; height: 4px; border-radius: 2px; background-color: #0f172a;">
                                ${timelineBlocks}
                            </div>
                        </div>
                    `;
                }

                const visualTimelineHTML = `
                    <div style="margin-top: 14px;">
                        <div style="font-size: 9px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">
                            90-Day Schedule
                        </div>
                        ${monthsHTML}
                    </div>
                `;
                // 👆 END TIMELINE GENERATOR 👆

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="room-id-badge">#${room.id}</span></td>
                    <td>
                        <div class="room-no-container">
                            <strong style="color: #f8fafc; font-size: 15px;">Room ${room.roomNumber}</strong>
                        </div>
                    </td>
                    <td><img src="${room.imageUrl ? room.imageUrl : 'https://via.placeholder.com/75x52/1e2230/cbd5e1?text=No+Img'}" class="thumbnail"></td>
                    <td style="min-width: 250px;">
                        <div style="font-weight:600; color:#f8fafc;">${room.title}</div>
                        <div style="font-size:12px; color:#64748b; margin-bottom: 6px;">📍 ${room.location}</div>
                        
                        <div style="font-size:11px; color:#60a5fa; font-weight:700; background:rgba(96,165,250,0.1); display:inline-block; padding:3px 6px; border-radius:4px; border:1px solid rgba(96,165,250,0.3);">
                            👨‍👩‍👧‍👦 Capacity: ${maxCap}
                        </div>
                        
                        <!-- Inject the visual calendar rod here! -->
                        ${visualTimelineHTML}
                    </td>
                    <td><span style="font-weight:700; color:#f8fafc;">₹${room.pricePerMonth}</span></td>
                    <td><div class="facilities-container">${facilitiesHTML}</div></td>
                    <td>
                        <div class="status-container ${room.available ? 'status-active' : 'status-vacant'}">
                            <span class="status-dot"></span>
                            ${room.available ? 'Vacant' : 'Occupied'}
                        </div>
                    </td>
                    <td>
                        <div class="btn-group">
                            <button class="toggle-btn" onclick="toggleStatus(${room.id})">Toggle Status</button>
                            
                            <button class="manage-btn" style="color: #60a5fa; border-color: rgba(96, 165, 250, 0.3); background-color: rgba(96, 165, 250, 0.1);" 
                                    onclick="openTenantDrawer(${room.id})">
                                👥 Schedule (${tenantCount})
                            </button>

                            <button class="manage-btn" onclick="openComplaintDrawer(${room.id})">
                                Complaints
                                ${actionBadgeHTML}
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /* ----- DRAWER CONTROLS ----- */
        
        function closeDrawer(drawerId) {
            activeDrawerRoomId = null;
            document.getElementById(drawerId).classList.remove('open');
            document.getElementById('mainContent').style.marginRight = '0px';
        }

        // COMPLAINTS DRAWER
        function openComplaintDrawer(roomId) {
            closeDrawer('tenantDrawer'); // Close the other drawer if open
            const room = allRoomsMemory.find(r => r.id === roomId);
            if (!room) return;

            activeDrawerRoomId = roomId;
            document.getElementById('drawerRoomTitle').textContent = `Room ${room.roomNumber} Logs`;
            
            const listWrapper = document.getElementById('drawerComplaintsList');
            listWrapper.innerHTML = '';

            if (room.complaints && room.complaints.length > 0) {
                room.complaints.forEach(c => {
                    const item = document.createElement('div');
                    item.className = `list-item complaint-item ${c.resolved ? 'resolved' : ''}`;
                    item.innerHTML = `
                        <div class="complaint-text">
                            <span style="font-size: 14px; margin-right: 4px;">${c.resolved ? '✅' : '⚠️'}</span>
                            ${c.description}
                        </div>
                        <button class="comp-btn ${c.resolved ? 'reopen' : 'resolve'}" onclick="toggleComplaint(${c.id})">
                            ${c.resolved ? 'Reopen' : 'Resolve'}
                        </button>
                    `;
                    listWrapper.appendChild(item);
                });
            } else {
                listWrapper.innerHTML = '<div class="no-data" style="padding: 20px 0;">No reported complaints.</div>';
            }

            document.getElementById('complaintDrawer').classList.add('open');
            document.getElementById('mainContent').style.marginRight = '350px';
        }

        // TENANT DRAWER (NEW)
function openTenantDrawer(roomId) {
            closeDrawer('complaintDrawer'); 
            const room = allRoomsMemory.find(r => r.id === roomId);
            if (!room) return;

            activeDrawerRoomId = roomId;
            document.getElementById('drawerTenantTitle').textContent = `Room ${room.roomNumber} Booking Schedule`;
            
            const listWrapper = document.getElementById('drawerTenantList');
            listWrapper.innerHTML = '';

            if (room.tenants && room.tenants.length > 0) {
                // 1. Get today's date in YYYY-MM-DD format for timeline comparison
                const todayObj = new Date();
                const todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth() + 1).padStart(2, '0') + '-' + String(todayObj.getDate()).padStart(2, '0');

                // 2. Group the raw list of tenants into distinct "Families" based on their shared check-in dates
                const bookings = {};
                room.tenants.forEach(t => {
                    const key = `${t.checkInDate}_${t.checkOutDate}`;
                    if (!bookings[key]) bookings[key] = [];
                    bookings[key].push(t);
                });

                // 3. Sort bookings chronologically so the earliest check-ins appear at the top
                const sortedKeys = Object.keys(bookings).sort((a, b) => a.localeCompare(b));

                let finalHTML = '';

                sortedKeys.forEach(key => {
                    const family = bookings[key];
                    const sharedCheckIn = family[0].checkInDate;
                    const sharedCheckOut = family[0].checkOutDate;
                    
                    // 4. Determine Timeline Status
                    let statusLabel = '';
                    let statusColor = '';
                    if (sharedCheckOut < todayStr) {
                        statusLabel = 'Past Booking';
                        statusColor = '#64748b'; // Grey
                    } else if (sharedCheckIn > todayStr) {
                        statusLabel = 'Upcoming Booking';
                        statusColor = '#eab308'; // Yellow
                    } else {
                        statusLabel = 'Currently Staying';
                        statusColor = '#22c55e'; // Green
                    }

                    // Notice the dynamic border-left color and status badge injected at the top!
                    finalHTML += `
                        <div style="background:#1e2230; padding:15px; border-radius:8px; border:1px solid #334155; margin-bottom: 15px; border-left: 4px solid ${statusColor};">
                            <div style="font-weight:700; color:#f8fafc; font-size:16px; margin-bottom:12px; border-bottom:1px solid #334155; padding-bottom:10px; display: flex; justify-content: space-between; align-items: center;">
                                <span>👪 Family Booking (${family.length} Guests)</span>
                                <span style="font-size:11px; padding:4px 8px; border-radius:4px; background:${statusColor}20; color:${statusColor}; border: 1px solid ${statusColor}40;">${statusLabel}</span>
                            </div>
                            <div style="font-size:13px; color:#60a5fa; margin-bottom:12px; font-weight:normal;">
                                📅 Stay: ${sharedCheckIn} to ${sharedCheckOut}
                            </div>
                    `;

                    // 5. Render individual family members inside this specific timeline block
                    family.forEach((t, index) => {
                        const idPhotoBadge = t.idProofImageUrl 
                            ? `<a href="${t.idProofImageUrl}" target="_blank" style="display:inline-block; margin-top:4px; padding:2px 8px; background:rgba(96,165,250,0.1); color:#60a5fa; border:1px solid rgba(96,165,250,0.3); border-radius:4px; text-decoration:none; font-size:11px; font-weight:600;">🖼️ View ID</a>`
                            : `
                            <div style="margin-top:4px; display:inline-block;">
                                <span style="font-size:11px; color:#64748b; font-style:italic; margin-right: 8px;">No Photo</span>
                                <label style="cursor:pointer; padding:2px 8px; background:rgba(234,179,8,0.1); color:#eab308; border:1px solid rgba(234,179,8,0.3); border-radius:4px; font-size:11px; font-weight:600;">
                                    📸 Upload
                                    <input type="file" style="display:none;" accept="image/*" onchange="uploadIdPhotoLater(${t.id}, this)">
                                </label>
                            </div>
                            `;

                        finalHTML += `
                            <div style="margin-bottom: ${index === family.length - 1 ? '0' : '12px'}; padding-bottom: ${index === family.length - 1 ? '0' : '12px'}; border-bottom: ${index === family.length - 1 ? 'none' : '1px dashed #2e354f'};">
                                <div style="font-weight:600; color:#e2e8f0; font-size:14px;">
                                    ${index === 0 ? '👑 Guest 1 (Primary):' : '👤 Guest ' + (index + 1) + ':'} ${t.fullName}
                                </div>
                                <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
                                    📞 ${t.phoneNumber ? t.phoneNumber : '<i>No phone</i>'} &nbsp;|&nbsp; 🪪 Gov ID: <span style="color:#cbd5e1;">${t.governmentIdNumber}</span>
                                </div>
                                ${idPhotoBadge}
                            </div>
                        `;
                    });

                    finalHTML += `</div>`;
                });

                listWrapper.innerHTML = finalHTML;
            } else {
                listWrapper.innerHTML = '<div class="no-data" style="padding: 20px 0;">Room is entirely vacant.<br>No bookings on file.</div>';
            }

            document.getElementById('tenantDrawer').classList.add('open');
            document.getElementById('mainContent').style.marginRight = '350px';
        }
        function redirectToAddTenant() {
            if (activeDrawerRoomId) {
                window.location.href = `/register-tenant.html?roomId=${activeDrawerRoomId}`;
            }
        }

        /* ----- ACTIONS ----- */

        function submitNewComplaint() {
            if (!activeDrawerRoomId) return;
            const input = document.getElementById('newComplaintInput');
            const desc = input.value.trim();
            if (!desc) return alert("Please specify the complaint details first.");

            const formData = new FormData();
            formData.append("description", desc);

            fetch(`/api/rooms/${activeDrawerRoomId}/complaints/add`, { method: 'POST', body: formData })
                .then(res => { if(!res.ok) throw new Error("Database error saving complaint"); return res.text(); })
                .then(() => {
                    input.value = '';
                    fetchLedger();
                })
                .catch(err => alert("Error: " + err.message));
        }

        function toggleComplaint(complaintId) {
            fetch(`/api/rooms/complaints/toggle/${complaintId}`, { method: 'PUT' })
                .then(res => { if(!res.ok) throw new Error("DB refusal"); return res.text(); })
                .then(() => { fetchLedger(); })
                .catch(err => alert("Error toggling: " + err.message));
        }

        function toggleStatus(id) {
            fetch(`/api/rooms/toggle-availability/${id}`, { method: 'PUT' })
                .then(res => { if (!res.ok) throw new Error("DB connection dropped"); return res.json(); })
                .then(() => { fetchLedger(); })
                .catch(err => alert("Error switching status: " + err.message));
        }

        function applyFilters() {
            const searchKeyword = document.getElementById('roomSearchInput').value.trim().toLowerCase();
            const statusSelection = document.getElementById('roomStatusFilter').value;
            const targetAmenities = Array.from(document.querySelectorAll('.facility-filter:checked')).map(cb => cb.value.toLowerCase());

            const filteredResults = allRoomsMemory.filter(room => {
                const matchesSearch = !searchKeyword || (room.roomNumber && room.roomNumber.toLowerCase().includes(searchKeyword));
                const matchesStatus = statusSelection === 'all' || (statusSelection === 'available' ? room.available : !room.available);
                const roomFacilitiesLower = (room.facilities || []).map(f => f.toLowerCase());
                const matchesAmenities = targetAmenities.every(amenity => roomFacilitiesLower.includes(amenity));
                return matchesSearch && matchesStatus && matchesAmenities;
            });
            renderTableData(filteredResults);
        }
    </script>
</body>
</html>
